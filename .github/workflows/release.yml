name: release

# 正式包只从这里出：测试先过，再用真正的 release 密钥签名；没有密钥就失败，绝不悄悄产出 debug 签名的「release」。
# 需要仓库 secrets：JEV_KEYSTORE_B64（keystore 文件的 base64）、JEV_KEYSTORE_PASSWORD、JEV_KEY_ALIAS、JEV_KEY_PASSWORD。
# 只上传 artifact，不自动建 GitHub Release、不自动发布，由人决定下一步。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      JEV_REQUIRE_RELEASE_KEY: '1'  # app/build.gradle.kts 的发布门禁：没有 release 签名配置就报错
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: 还原签名密钥（缺任何一个 secret 就停）
        env:
          KEYSTORE_B64: ${{ secrets.JEV_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.JEV_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.JEV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.JEV_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::缺少 secret：$v。不能出正式包。"; exit 1; }
          done
          umask 077
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$RUNNER_TEMP/release.properties"
          echo "JEV_KEYSTORE_PROPS=$RUNNER_TEMP/release.properties" >> "$GITHUB_ENV"

      - name: 编 release 包
        run: ./gradlew assembleRelease --console=plain

      - name: 确认签名不是 debug 证书
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort | tail -1)
          "$apksigner" verify --print-certs "$apk" | tee /tmp/certs.txt
          if grep -qi "CN=Android Debug" /tmp/certs.txt; then
            echo "::error::release 包是 debug 证书签的"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: jev-assistant-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
